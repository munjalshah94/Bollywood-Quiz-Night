<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c2632">
  <title>Bollywood Quiz Night</title>
  <meta name="description" content="A Bollywood quiz night for your party: five rounds, a scoreboard and a charades timer.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <header id="topbar" hidden>
      <div id="crumb" class="crumb"></div>
      <nav class="topnav">
        <button type="button" class="btn btn-ghost btn-sm" id="btn-menu" title="Round menu (M)">Menu</button>
      </nav>
    </header>
    <main id="screen" tabindex="-1" aria-live="polite"></main>
    <aside id="scoreboard" hidden aria-label="Scoreboard"></aside>
  </div>

  <dialog id="dlg">
    <form method="dialog" id="dlg-form">
      <h2 id="dlg-title"></h2>
      <p id="dlg-text"></p>
      <div class="dlg-actions">
        <button type="submit" value="cancel" class="btn btn-ghost">Cancel</button>
        <button type="submit" value="ok" class="btn btn-danger" id="dlg-ok">OK</button>
      </div>
    </form>
  </dialog>

  <noscript><p style="padding:2rem;font:1.2rem sans-serif">This quiz needs JavaScript.</p></noscript>
  <script src="js/app.js"></script>
</body>
</html>
